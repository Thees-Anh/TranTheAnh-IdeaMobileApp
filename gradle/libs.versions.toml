[versions]
webkit = "1.15.0"
work = "2.12.0"
datetime = "0.7.1"
agp = "9.1.1"
android-compileSdk = "37"
android-minSdk = "24"
android-targetSdk = "37"
androidx-activity = "1.13.0"
androidx-appcompat = "1.8.0"
androidx-core = "1.19.1"
androidx-espresso = "3.7.0"
androidx-lifecycle = "2.11.0"
androidx-testExt = "1.3.0"
androidx-testRunner = "1.7.0"
composeMultiplatform = "1.12.2"
junit = "4.13.2"
kotlin = "2.4.21"
material3 = "1.9.0"
coroutines = "1.11.0"
koin = "4.2.2"
sceneview = "2.3.3"
filament = "1.68.2"
supabase = "3.8.0"
ktor = "3.5.1"
serialization = "1.11.0"
desugar = "2.1.5"

[libraries]
androidx-webkit = { module = "androidx.webkit:webkit", version.ref = "webkit" }
androidx-work = { module = "androidx.work:work-runtime", version.ref = "work" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "datetime" }
supabase-auth = { module = "io.github.jan-tennert.supabase:auth-kt", version.ref = "supabase" }
supabase-postgrest = { module = "io.github.jan-tennert.supabase:postgrest-kt", version.ref = "supabase" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
desugar-jdk-libs = { module = "com.android.tools:desugar_jdk_libs", version.ref = "desugar" }
sceneview = { module = "io.github.sceneview:sceneview", version.ref = "sceneview" }
filament-android = { module = "com.google.android.filament:filament-android", version.ref = "filament" }
