        /* =========================================================
           1. PHONG CÁCH THẺ KAWAII & 4 CẤP ĐỘ HIẾM (RARITY TIERS)
           ========================================================= */
        .kawaii-card {
            border: 3px solid #4B2412;
            box-shadow: 0 6px 0 rgba(75, 36, 18, 0.15);
        }
        .kawaii-btn {
            border: 2.5px solid #4B2412;
            box-shadow: 0 3px 0 #4B2412;
            transition: all 0.12s ease;
        }
        .kawaii-btn:hover:not(:disabled) {
            transform: translateY(-1.5px);
            box-shadow: 0 4.5px 0 #4B2412;
        }
        .kawaii-btn:active:not(:disabled), .kawaii-btn.active-btn {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #4B2412;
        }
        .kawaii-btn:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        /* Màu sắc 4 Phẩm chất (Common 55%, Rare 30%, Epic 12%, Legendary 3%) */
        .rarity-common {
            background: linear-gradient(180deg, #EFF6FF 0%, #DBEAFE 100%);
            border-color: #3B82F6;
        }
        .rarity-rare {
            background: linear-gradient(180deg, #FAF5FF 0%, #F3E8FF 100%);
            border-color: #A855F7;
        }
        .rarity-epic {
            background: linear-gradient(180deg, #FDF2F8 0%, #FCE7F3 100%);
            border-color: #EC4899;
        }
        @keyframes legendaryShine {
            0%, 100% {
                background-position: 0% 50%;
                box-shadow: 0 0 15px rgba(245, 158, 11, 0.55), inset 0 0 12px rgba(254, 240, 138, 0.8);
            }
            50% {
                background-position: 100% 50%;
                box-shadow: 0 0 28px rgba(245, 158, 11, 0.95), inset 0 0 20px rgba(254, 240, 138, 1);
            }
        }
        .rarity-legendary {
            background: linear-gradient(135deg, #FEF9C3 0%, #FDE047 50%, #F59E0B 100%);
            background-size: 200% 200%;
            border-color: #D97706;
            animation: legendaryShine 2.2s ease infinite;
        }

        /* =========================================================
           2. ANIMATION RƯƠNG KHO BÁU (IDLE -> SHAKE -> BURST OPEN)
           ========================================================= */
        #gacha-chest-root {
            transform-origin: 300px 250px;
        }
        #chest-lid-group {
            transform-origin: 300px 158px;
            transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* Rương đứng yên nhấp nhô nhẹ */
        @keyframes chestIdleFloat {
            0%, 100% { transform: translateY(0px) scale(1, 1); }
            50% { transform: translateY(-5px) scale(1.015, 0.985); }
        }
        .chest-state-idle #gacha-chest-root {
            animation: chestIdleFloat 2.8s ease-in-out infinite;
        }

        /* Rương lắc mạnh chuẩn bị nổ mở (1.15s) */
        @keyframes chestViolentShake {
            0% { transform: translate(0, 0) rotate(0deg) scale(1, 1); }
            15% { transform: translate(-8px, 4px) rotate(-6deg) scale(1.08, 0.92); }
            30% { transform: translate(9px, -6px) rotate(7deg) scale(0.94, 1.07); }
            45% { transform: translate(-10px, 2px) rotate(-8deg) scale(1.09, 0.91); }
            60% { transform: translate(10px, -4px) rotate(8deg) scale(0.95, 1.06); }
            75% { transform: translate(-12px, 3px) rotate(-10deg) scale(1.12, 0.88); }
            90% { transform: translate(8px, -10px) rotate(6deg) scale(0.92, 1.12); }
            100% { transform: translate(0, 0) rotate(0deg) scale(1, 1); }
        }
        .chest-state-shaking #gacha-chest-root {
            animation: chestViolentShake 1.1s ease-in-out infinite;
        }

        /* Rương bật nắp phát sáng */
        .chest-state-opened #chest-lid-group {
            transform: translateY(-28px) rotate(-18deg) scale(1.04);
        }
        @keyframes chestLightRaysSpin {
            0% { transform: rotate(0deg) scale(0.9); opacity: 0.75; }
            50% { transform: rotate(180deg) scale(1.08); opacity: 1; }
            100% { transform: rotate(360deg) scale(0.9); opacity: 0.75; }
        }
        #chest-light-burst {
            transform-origin: 300px 168px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .chest-state-opened #chest-light-burst,
        .chest-state-shaking #chest-light-burst {
            opacity: 1;
            animation: chestLightRaysSpin 6s linear infinite;
        }

        .cs2-viewport {

            position: absolute;
            top: 0;
            bottom: 0;
            width: 64px;
            z-index: 20;
            pointer-events: none;
        }
        .cs2-viewport::before {
            left: 0;
            background: linear-gradient(90deg, rgba(24, 15, 34, 0.95) 0%, rgba(24, 15, 34, 0) 100%);
        }
        .cs2-viewport::after {
            right: 0;
            background: linear-gradient(270deg, rgba(24, 15, 34, 0.95) 0%, rgba(24, 15, 34, 0) 100%);
        }

        /* Dải băng chuyền chứa 65 thẻ vật phẩm */
        #cs2-reel-track {
            display: flex;
            align-items: center;
            gap: 10px;
            will-change: transform;
        }

        /* Kích thước cố định mỗi thẻ trên dải CS2: 116px + gap 10px = 126px pitch */
        .cs2-reel-card {
            width: 116px;
            height: 132px;
            flex-shrink: 0;
            border-radius: 16px;
            border-width: 3px;
            border-style: solid;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 8px 6px;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }
        .cs2-reel-card.winning-card-highlight {
            transform: scale(1.08);
            z-index: 15;
            box-shadow: 0 0 25px rgba(250, 204, 21, 0.95);
        }

        /* Con trỏ cố định ở tâm dải quay */
        @keyframes pointerPulse {
            0%, 100% { transform: translateX(-50%) scale(1); }
            50% { transform: translateX(-50%) scale(1.08); }
        }
        .cs2-center-pointer {
            position: absolute;
            top: -4px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 30;
            pointer-events: none;
            animation: pointerPulse 1.2s ease-in-out infinite;
        }
        .cs2-center-laser {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 50%;
            width: 3px;
            transform: translateX(-50%);
            background: linear-gradient(180deg, #FACC15 0%, #FB7185 50%, #FACC15 100%);
            box-shadow: 0 0 10px #FACC15;
            z-index: 25;
            pointer-events: none;
        }

           4. ANIMATION THÚ CƯNG & 24 VẬT PHẨM TRONG PHÒNG THỬ ĐỒ
           ========================================================= */

        /* Ẩn/Hiện vật phẩm trong phòng */

        ::-webkit-scrollbar-track { background: #181825; border-radius: 6px; }
        ::-webkit-scrollbar-thumb { background: #f472b6; border-radius: 6px; }

            { id: 'furn-cat-tree', name: 'Trụ Cào Móng 3 Tầng', icon: '🧶', category: 'furn', rarity: 'epic', active: false, desc: 'Nhà cây 3 tầng có bóng bông lắc lư' },
            { id: 'furn-gramophone', name: 'Máy Đĩa Than Cổ Điển', icon: '🎶', category: 'furn', rarity: 'epic', active: false, desc: 'Máy phát nhạc đĩa than bay nốt nhạc' },
            { id: 'furn-window', name: 'Cửa Sổ Cầu Vồng Đôi', icon: '🌈', category: 'furn', rarity: 'epic', active: true, desc: 'Cửa sổ vòm ngắm cầu vồng & mây trôi' },

            // --- LEGENDARY (3% - 6 Vật phẩm, có 3 món thần thoại mới) ---
            { id: 'acc-crown', name: 'Vương Miện Hoàng Gia', icon: '👑', category: 'acc', rarity: 'legendary', active: true, desc: 'Vương miện vàng ròng đính ngọc bích' },
            { id: 'acc-wings', name: 'Đôi Cánh Thiên Thần', icon: '🪽', category: 'acc', rarity: 'legendary', active: false, desc: 'Đôi cánh trắng muốt vẫy nhịp nhàng' },
            { id: 'furn-bed', name: 'Đệm Ngủ Vương Miện', icon: '🛋️', category: 'furn', rarity: 'legendary', active: false, desc: 'Giường nhung hồng vương giả êm ái' },
        ];

        // =========================================================================
        
const TOTAL_REEL_CARDS = 65;   // Tổng số thẻ sinh ra trên băng chuyền
        const WINNING_CARD_INDEX = 52; // Vị trí thẻ trúng thưởng dừng lại dưới con trỏ
        const CARD_WIDTH_PX = 116;     // Chiều rộng 1 thẻ
        const CARD_GAP_PX = 10;        // Khoảng cách giữa 2 thẻ
        const CARD_PITCH_PX = CARD_WIDTH_PX + CARD_GAP_PX; // 126px mỗi bước thẻ

        
let CASE_DISPLAY_ITEMS = GACHA_ITEMS_POOL;
function buildReelCards(winningItem = null) {
            const track = document.getElementById('cs2-reel-track');
            const cardsHtml = [];

            for (let i = 0; i < TOTAL_REEL_CARDS; i++) {
                let item;
                if (i === WINNING_CARD_INDEX && winningItem) {
                    item = winningItem;
                } else {
                    // Cosmetic filler only; never determines the confirmed winner.
                    item = CASE_DISPLAY_ITEMS[Math.floor(Math.random() * CASE_DISPLAY_ITEMS.length)];
                }
                const rConf = RARITY_CONFIG[item.rarity];

                cardsHtml.push(`
                    <div id="reel-card-${i}" class="cs2-reel-card ${rConf.cardClass}">
                        <div class="w-full flex items-center justify-between">
                            <span class="text-[9px] font-extrabold px-1.5 py-0.5 rounded ${rConf.badgeBg}">
                                ${rConf.label}
                            </span>
                            <span class="text-[10px]">${item.category === 'acc' ? '👑' : '🛋️'}</span>
                        </div>
                        <div class="text-3xl my-1 drop-shadow-sm">${item.icon}</div>
                        <div class="w-full text-center">
                            <div class="text-[10px] font-extrabold text-[#4B2412] leading-tight line-clamp-2">
                                ${item.name}
                            </div>
                        </div>
                        <div class="w-full h-1.5 rounded-full mt-0.5" style="background:${rConf.colorHex}"></div>
                    </div>
                `);
            }

            track.style.transition = 'none';
            track.style.transform = 'translateX(0px)';
            track.innerHTML = cardsHtml.join('');
        }

        // =========================================================================
        
/* Presentation adapter for the preserved PawQuest chest/reel design.
 * No purchases, currency changes, ownership checks, grants or outcome RNG. */
(() => {
    'use strict';
    const VERSION = 1;
    const uuid = /^[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}$/i;
    const track = document.getElementById('cs2-reel-track');
    const viewport = document.getElementById('cs2-viewport-box');
    const chest = document.getElementById('chest-svg-container');
    const visuals = new Map(GACHA_ITEMS_POOL.map(item => [item.id, item]));
    let items = new Map(), config = null, current = null, phase = 'idle';
    let shakeTimer = null, finishTimer = null, frame = null, transitionDone = null;
    const escapeText = text => text.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    function clean() {
        clearTimeout(shakeTimer); clearTimeout(finishTimer); cancelAnimationFrame(frame);
        if (transitionDone) track.removeEventListener('transitionend', transitionDone);
        shakeTimer = finishTimer = frame = transitionDone = null;
    }
    function emit(event, reason) {
        const message = {version: VERSION, event, reason, playbackId: config.playbackId,
            transactionId: current.transactionId, winningItemId: current.winningItemId};
        // Origin/main-frame validation is performed by the native message listener.
        if (window.PawQuestCaseEvents) window.PawQuestCaseEvents.postMessage(JSON.stringify(message));
    }
    function centerWinner() {
        const card = document.getElementById(`reel-card-${WINNING_CARD_INDEX}`);
        if (!card || !current || card.dataset.itemId !== current.winningItemId) throw Error('winner_missing');
        track.style.transition = 'none';
        track.style.transform = 'translateX(0px)';
        const target = card.getBoundingClientRect();
        const indicator = document.querySelector('.cs2-center-laser').getBoundingClientRect();
        return (indicator.left + indicator.width / 2) - (target.left + target.width / 2);
    }
    function finish(reason) {
        if (!current || phase === 'complete' || phase === 'error') return;
        clean();
        try {
            const position = centerWinner();
            track.style.transform = `translateX(${position}px)`;
            document.getElementById(`reel-card-${WINNING_CARD_INDEX}`).classList.add('winning-card-highlight');
            chest.classList.remove('chest-state-idle', 'chest-state-shaking');
            chest.classList.add('chest-state-opened');
            phase = 'complete';
            emit('complete', reason);
        } catch (_) { phase = 'error'; emit('error', 'layout_unavailable'); }
    }
    function initialize(value) {
        if (current || !value || value.version !== VERSION || !uuid.test(value.playbackId) ||
            !Array.isArray(value.items) || !value.items.length || value.items.length > 256) return false;
        const mapped = new Map();
        for (const item of value.items) {
            if (!item || !uuid.test(item.itemId) || mapped.has(item.itemId) || typeof item.name !== 'string' ||
                !item.name.length || item.name.length > 512 || typeof item.assetId !== 'string' ||
                !Object.hasOwn(RARITY_CONFIG, item.rarity)) return false;
            const art = visuals.get(item.assetId);
            mapped.set(item.itemId, {id: item.itemId, assetId: item.assetId, name: escapeText(item.name),
                icon: art?.icon || '☆', category: art?.category || 'unknown', rarity: item.rarity});
        }
        config = {playbackId: value.playbackId, fast: value.fast === true, reducedMotion: value.reducedMotion === true};
        items = mapped;
        CASE_DISPLAY_ITEMS = [...mapped.values()];
        return true;
    }
    function play(result) {
        if (!config || !result || !uuid.test(result.transactionId) || !uuid.test(result.winningItemId)) return false;
        if (current) return current.transactionId === result.transactionId && current.winningItemId === result.winningItemId;
        if (!items.has(result.winningItemId)) return false;
        current = {transactionId: result.transactionId, winningItemId: result.winningItemId};
        phase = 'shaking';
        clean();
        // Existing 65-card renderer, with the confirmed item forced at slot 52.
        buildReelCards(items.get(current.winningItemId));
        document.getElementById(`reel-card-${WINNING_CARD_INDEX}`).dataset.itemId = current.winningItemId;
        chest.classList.remove('chest-state-idle', 'chest-state-opened');
        chest.classList.add('chest-state-shaking');
        if (config.reducedMotion || window.matchMedia('(prefers-reduced-motion: reduce)').matches) { finish('reduced_motion'); return true; }
        shakeTimer = setTimeout(() => {
            shakeTimer = null;
            phase = 'rolling';
            chest.classList.remove('chest-state-shaking'); chest.classList.add('chest-state-opened');
            const position = centerWinner();
            track.offsetHeight; // Commit the initial position before applying the original easing.
            const duration = config.fast ? 1800 : 4800;
            transitionDone = event => { if (event.target === track && event.propertyName === 'transform') finish('finished'); };
            track.addEventListener('transitionend', transitionDone);
            track.style.transition = `transform ${duration}ms cubic-bezier(0.10, 0.82, 0.08, 1)`;
            track.style.transform = `translateX(${position}px)`;
            // Timer is a visual recovery fallback, never an economic operation.
            finishTimer = setTimeout(() => finish('transition_fallback'), duration + 350);
        }, config.fast ? 450 : 1100);
        return true;
    }
    function reset() {
        if (current && phase !== 'complete' && phase !== 'error') finish('cancelled');
        clean(); current = null; phase = 'idle'; config = null; items.clear();
        CASE_DISPLAY_ITEMS = GACHA_ITEMS_POOL;
        track.style.transition = 'none'; track.style.transform = 'translateX(0px)';
        chest.classList.remove('chest-state-opened', 'chest-state-shaking'); chest.classList.add('chest-state-idle');
        buildReelCards();
        return true;
    }
    function fit() {
        const height = window.innerHeight;
        if (height > 0) document.querySelectorAll('html,body,main,#gacha-stage-container').forEach(e => e.style.height = height + 'px');
        if (current && phase === 'complete') track.style.transform = `translateX(${centerWinner()}px)`;
        else if (current && (phase === 'rolling' || phase === 'shaking')) finish('resized');
    }
    window.PawQuestCase = Object.freeze({
        initialize, play, reset,
        skip: () => { if (!current) return false; finish('skipped'); return true; },
        pause: paused => {
            document.querySelectorAll('*').forEach(e => e.style.animationPlayState = paused ? 'paused' : 'running');
            if (paused) finish('interrupted');
        },
        status: () => ({version: VERSION, phase, transactionId: current?.transactionId, winningItemId: current?.winningItemId})
    });
    window.addEventListener('resize', fit);
    window.addEventListener('pagehide', () => { finish('interrupted'); clean(); });
    document.addEventListener('visibilitychange', () => { if (document.hidden) finish('interrupted'); });
    window.onload = () => { fit(); buildReelCards(); window.pawquestCasePreviewReady = true; };
    window.pawquestCasePreviewPause = paused => window.PawQuestCase.pause(paused);
})();
