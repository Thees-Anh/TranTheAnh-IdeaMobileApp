<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>PawQuest Bistro</title><link rel="stylesheet" href="bistro.css"><style>
        * {
            font-family: 'Quicksand', sans-serif;
            user-select: none;
        }
        code, pre, .font-mono {
            font-family: 'JetBrains Mono', monospace;
            user-select: text;
        }
        body {
            background-color: #FFF5F8;
            color: #4B2412;
        }

        /* =========================================================
           1. PHONG CÁCH KAWAII PASTEL & VIỀN NÂU ĐẬM (#4B2412)
           ========================================================= */
        .kawaii-card {
            border: 3px solid #4B2412;
            box-shadow: 0 6px 0 rgba(75, 36, 18, 0.14);
        }
        .kawaii-btn {
            border: 2.5px solid #4B2412;
            box-shadow: 0 3.5px 0 #4B2412;
            transition: all 0.12s ease;
        }
        .kawaii-btn:hover:not(:disabled) {
            transform: translateY(-1.5px);
            box-shadow: 0 5px 0 #4B2412;
        }
        .kawaii-btn:active:not(:disabled), .kawaii-btn.active-btn {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #4B2412;
        }

        /* =========================================================
           2. KEYFRAMES CHUYỂN ĐỘNG CỦA THÚ CƯNG KHI ĐỨNG YÊN / ĂN / UỐNG / VUI
           ========================================================= */
        #pet-actor-root, #pet-head-rig, #pet-body-rig, #pet-tail-rig, #pet-ear-l, #pet-ear-r {
            transform-box: fill-box;
        }
        #pet-body-rig { transform-origin: 50% 95%; }
        #pet-head-rig { transform-origin: 50% 82%; }
        #pet-tail-rig { transform-origin: 85% 85%; }
        #pet-ear-l { transform-origin: 80% 20%; }
        #pet-ear-r { transform-origin: 20% 20%; }

        /* Trạng thái 1: Đứng yên (Idle) */
        @keyframes petIdleBreath {
            0%, 100% { transform: scale(1, 1); }
            50% { transform: scale(1.02, 0.98); }
        }
        @keyframes petIdleHeadTilt {
            0%, 100% { transform: rotate(-1.5deg) translateY(0px); }
            50% { transform: rotate(2deg) translateY(2px); }
        }
        @keyframes petTailWagSlow {
            0%, 100% { transform: rotate(-6deg); }
            50% { transform: rotate(10deg); }
        }
        .state-idle #pet-body-rig { animation: petIdleBreath 2.8s ease-in-out infinite; }
        .state-idle #pet-head-rig { animation: petIdleHeadTilt 3.2s ease-in-out infinite; }
        .state-idle #pet-tail-rig { animation: petTailWagSlow 2.2s ease-in-out infinite; }

        /* Trạng thái 2: Đang Ăn (Eating) */
        @keyframes petEatHeadBob {
            0%, 100% { transform: translateY(10px) rotate(5deg) scale(1, 1); }
            50% { transform: translateY(18px) rotate(-3deg) scale(1.04, 0.96); }
        }
        @keyframes petEatBodySquish {
            0%, 100% { transform: scale(1.02, 0.98); }
            50% { transform: scale(1.06, 0.94); }
        }
        @keyframes petChewMouth {
            0%, 100% { transform: scaleY(1) scaleX(1); }
            50% { transform: scaleY(0.35) scaleX(1.25); }
        }
        @keyframes crumbFlyLeft {
            0% { opacity: 1; transform: translate(0, 0) scale(0.8); }
            100% { opacity: 0; transform: translate(-22px, -16px) scale(1.2); }
        }
        @keyframes crumbFlyRight {
            0% { opacity: 1; transform: translate(0, 0) scale(0.8); }
            100% { opacity: 0; transform: translate(22px, -18px) scale(1.2); }
        }
        .state-eating #pet-head-rig { animation: petEatHeadBob 0.42s ease-in-out infinite; }
        .state-eating #pet-body-rig { animation: petEatBodySquish 0.42s ease-in-out infinite; }
        .state-eating #pet-tail-rig { animation: petTailWagSlow 0.4s ease-in-out infinite; }
        .state-eating .chew-mouth-anim {
            transform-box: fill-box;
            transform-origin: center;
            animation: petChewMouth 0.24s ease-in-out infinite;
        }
        .state-eating .crumb-l { animation: crumbFlyLeft 0.45s ease-out infinite; }
        .state-eating .crumb-r { animation: crumbFlyRight 0.45s 0.18s ease-out infinite; }

        /* Trạng thái 3: Đang Uống (Drinking) */
        @keyframes petDrinkHeadDip {
            0%, 100% { transform: translateY(12px) rotate(3deg); }
            50% { transform: translateY(15px) rotate(5deg); }
        }
        @keyframes petSipTongue {
            0%, 100% { transform: translateY(0px) scaleY(1); }
            50% { transform: translateY(4px) scaleY(1.3); }
        }
        @keyframes bubbleFloatUp {
            0% { opacity: 0.9; transform: translateY(0) scale(0.8); }
            100% { opacity: 0; transform: translateY(-24px) scale(1.3); }
        }
        .state-drinking #pet-head-rig { animation: petDrinkHeadDip 0.65s ease-in-out infinite; }
        .state-drinking #pet-body-rig { animation: petIdleBreath 1.2s ease-in-out infinite; }
        .state-drinking .sip-tongue-anim {
            transform-box: fill-box;
            transform-origin: top center;
            animation: petSipTongue 0.3s ease-in-out infinite;
        }
        .state-drinking .drink-bubble-1 { animation: bubbleFloatUp 0.8s ease-out infinite; }
        .state-drinking .drink-bubble-2 { animation: bubbleFloatUp 0.8s 0.35s ease-out infinite; }

        /* Trạng thái 4: No Bụng Hạnh Phúc (Happy Full) */
        @keyframes petHappyJump {
            0%, 100% { transform: translateY(0px) scale(1.03, 0.97); }
            50% { transform: translateY(-12px) scale(0.97, 1.04); }
        }
        .state-happy #pet-actor-root { animation: petHappyJump 0.45s ease-in-out infinite; }

        /* =========================================================
           3. KEYFRAMES ĐẠO CỤ MÓN ĂN (KHÓI BỐC LÊN, PUDDING NÚNG NÍNH, LẨU SÔI)
           ========================================================= */
        @keyframes foodSteamRise {
            0% { opacity: 0; transform: translateY(4px) scaleX(0.9); }
            50% { opacity: 0.85; transform: translateY(-6px) scaleX(1.1); }
            100% { opacity: 0; transform: translateY(-16px) scaleX(0.95); }
        }
        @keyframes foodJiggleBounce {
            0%, 100% { transform: scale(1, 1); }
            40% { transform: scale(1.06, 0.94); }
            75% { transform: scale(0.96, 1.04); }
        }
        @keyframes stageFoodPlop {
            0% { transform: translateY(-25px) scale(0.5); opacity: 0; }
            65% { transform: translateY(4px) scale(1.08, 0.92); opacity: 1; }
            100% { transform: translateY(0px) scale(1, 1); opacity: 1; }
        }
        @keyframes floatBuffText {
            0% { opacity: 0; transform: translateY(10px) scale(0.8); }
            20% { opacity: 1; transform: translateY(0px) scale(1.05); }
            80% { opacity: 1; transform: translateY(-26px) scale(1); }
            100% { opacity: 0; transform: translateY(-38px) scale(0.95); }
        }
        .steam-line-1 { animation: foodSteamRise 1.8s ease-in-out infinite; }
        .steam-line-2 { animation: foodSteamRise 1.8s 0.6s ease-in-out infinite; }
        .steam-line-3 { animation: foodSteamRise 1.8s 1.2s ease-in-out infinite; }
        .food-jiggle {
            transform-box: fill-box;
            transform-origin: bottom center;
            animation: foodJiggleBounce 1.4s ease-in-out infinite;
        }
        .stage-dish-enter {
            transform-box: fill-box;
            transform-origin: bottom center;
            animation: stageFoodPlop 0.38s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        .state-eating #stage-food-slot, .state-drinking #stage-food-slot {
            animation: foodJiggleBounce 0.42s ease-in-out infinite;
        }
        .floating-buff-badge {
            animation: floatBuffText 1.7s ease-out forwards;
        }

        /* Ẩn/hiện biểu cảm khuôn mặt thú cưng theo trạng thái */
        .face-idle, .face-eating, .face-drinking, .face-happy, #fx-eating-crumbs, #fx-drinking-bubbles, #fx-happy-hearts {
            display: none;
        }
        .state-idle .face-idle { display: inline; }
        .state-eating .face-eating, .state-eating #fx-eating-crumbs { display: inline; }
        .state-drinking .face-drinking, .state-drinking #fx-drinking-bubbles { display: inline; }
        .state-happy .face-happy, .state-happy #fx-happy-hearts { display: inline; }

        ::-webkit-scrollbar { width: 7px; height: 7px; }
        ::-webkit-scrollbar-track { background: #181825; border-radius: 6px; }
        ::-webkit-scrollbar-thumb { background: #f472b6; border-radius: 6px; }
    
@font-face{font-family:Quicksand;src:url('../gacha/quicksand.ttf')}html,body{margin:0;width:100%;background:#fff5f8;overflow-x:hidden}
main{padding:8px}#stage{height:clamp(210px,34vh,300px);position:relative;border:2px solid #4b2412;border-radius:20px;overflow:hidden;background:#ffc8dd}
#bistro-stage-svg{position:relative;width:100%;height:100%}#menu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding-top:12px;padding-bottom:20px}
.meal{min-width:0;border:2px solid #4b2412;border-radius:18px;background:white;padding:10px;display:flex;flex-direction:column;gap:6px}
.meal svg{width:100%;height:100px}.meal h3{font-size:13px;font-weight:800;min-height:34px}.meal p{font-size:11px}.meal button{margin-top:auto;min-height:44px;border:2px solid #4b2412;border-radius:12px;background:#fcd34d;font-weight:800}
.meal button:disabled{opacity:.5}#meal-status{font-size:13px;font-weight:700;text-align:center;padding:6px}.pq-paused *,.offscreen *{animation-play-state:paused!important}
#floating-buff-container{position:absolute;top:28px;right:12px;pointer-events:none}.buff{display:block;background:#fff9f5;border:2px solid #4b2412;border-radius:14px;padding:8px;font-size:12px;font-weight:800}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

            <!-- 8. Mì Ramen Trứng Lòng Đào (120 Xu - Cao Cấp - Food) -->
            <g id="food-ramen-bowl">

/* Display only. Native code confirms purchases; JS never changes economy or pet stats. */
(()=>{'use strict';
const assets=new Set(['food-bone-biscuit','food-fresh-carrot','food-warm-milk','food-taiyaki','food-onigiri','food-boba-tea','food-cat-pudding','food-ramen-bowl','food-salmon-sushi','food-berry-parfait','food-wagyu-steak','food-royal-hotpot']);
const uuid=/^[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}$/i;
let config=null,current=null,timer=null,phase='idle',items=new Map(),menuKey='';
const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const wrapper=document.getElementById('pet-stage-wrapper'),svg=document.getElementById('bistro-stage-svg');
function state(value){wrapper.setAttribute('class','state-'+value);['idle','eating','drinking','happy'].forEach(s=>svg.classList.remove('state-'+s));svg.classList.add('state-'+value);phase=value;}
function emit(event,itemId){if(config&&window.PawQuestBistroEvents)window.PawQuestBistroEvents.postMessage(JSON.stringify({version:1,viewId:config.viewId,event,itemId,transactionId:current?.transactionId}));}
function finish(){if(!current||phase==='complete')return;clearTimeout(timer);state('idle');phase='complete';document.getElementById('floating-buff-container').replaceChildren();emit('complete',current.itemId);}
function initialize(value){
 if(!value||value.version!==1||!uuid.test(value.viewId)||!Array.isArray(value.items)||value.items.length>12)return false;
 const next=new Map();for(const item of value.items){if(!uuid.test(item.itemId)||next.has(item.itemId)||!assets.has(item.assetId)||!['food','drink'].includes(item.type)||typeof item.name!=='string'||item.price<=0)return false;next.set(item.itemId,item);}
 config=value;items=next;
 const key=JSON.stringify([value.items,value.species,value.labels]);
 if(key!==menuKey){menuKey=key;document.getElementById('pet-actor-root').innerHTML=PET_TEMPLATES[value.species]||PET_TEMPLATES.cat;
  document.getElementById('menu').innerHTML=value.items.map(item=>`<article class="meal"><p>${escape(item.tier)}</p><svg viewBox="0 0 120 120" aria-hidden="true"><use href="#${item.assetId}"/></svg><h3>${escape(item.name)}</h3><p>+${item.hunger} ${escape(value.labels.fullness)} · +${item.happiness} ${escape(value.labels.joy)} · +${item.xp} EXP</p><button type="button" data-item="${item.itemId}">${escape(value.labels.buy)} · ${item.price} ${escape(value.labels.coins)}</button></article>`).join('');
 }
 document.querySelectorAll('button[data-item]').forEach(b=>{b.disabled=!value.canOrder;});return true;
}
function play(result){
 if(!config||!result||!uuid.test(result.transactionId)||!uuid.test(result.itemId)||!assets.has(result.assetId)||!['food','drink'].includes(result.type))return false;
 if(current?.transactionId===result.transactionId)return true;
 const item=result;clearTimeout(timer);current={transactionId:result.transactionId,itemId:result.itemId};
 const slot=document.getElementById('stage-food-slot');slot.innerHTML=`<use href="#${item.assetId}"/>`;
 document.getElementById('meal-status').textContent=item.name;
 const buff=document.createElement('span');buff.className='floating-buff-badge buff';
 buff.textContent=`+${Number(result.hunger)||0} ${config.labels.fullness} · +${Number(result.happiness)||0} ${config.labels.joy} · +${Number(result.xp)||0} EXP`;
 document.getElementById('floating-buff-container').replaceChildren(buff);
 document.getElementById('stage').scrollIntoView({behavior:'smooth',block:'start'});
 state(item.type==='drink'?'drinking':'eating');
 if(config.reducedMotion||window.matchMedia('(prefers-reduced-motion: reduce)').matches){finish();return true;}
 timer=setTimeout(()=>{if(item.type==='drink'){finish();return;}state('happy');timer=setTimeout(finish,2000);},3200);return true;
}
document.getElementById('menu').addEventListener('click',event=>{const button=event.target.closest('button[data-item]');if(button&&!button.disabled&&items.has(button.dataset.item))emit('select',button.dataset.item);});
window.PawQuestBistro=Object.freeze({initialize,play,skip:finish,pause:()=>{document.documentElement.classList.add('pq-paused');finish();},resume:()=>document.documentElement.classList.remove('pq-paused'),dispose:()=>{clearTimeout(timer);config=null;current=null;items.clear();},getState:()=>phase});
document.getElementById('stage-food-slot').replaceChildren();state('idle');window.pawquestBistroReady=true;
})();
</script></body></html>
