<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'">
<style>* {
            font-family: 'Quicksand', sans-serif;
            user-select: none;
        }
        code, pre, .font-mono {
            font-family: 'JetBrains Mono', monospace;
            user-select: text;
        }

        body {
            background-color: #fdf2f8;
            color: #4A2511;
        }

        /* =========================================================
           HỆ THỐNG RIGGING & KEYFRAME ANIMATIONS CHO CHÚ CÚN MẪU
           ========================================================= */
        #dog-whole {
            transform-origin: 200px 280px;
            transition: transform 0.3s ease;
        }
        #dog-body-group {
            transform-origin: 200px 265px;
        }
        #dog-head-group {
            transform-origin: 200px 185px;
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        #ear-left {
            transform-origin: 138px 110px;
            transition: transform 0.35s ease;
        }
        #ear-right {
            transform-origin: 256px 110px;
            transition: transform 0.35s ease;
        }
        #dog-tail {
            transform-origin: 138px 258px;
        }
        #paws-front {
            transform-origin: 200px 215px;
        }

        /* 1. TRẠNG THÁI ĐỨNG YÊN (IDLE) */
        @keyframes dogIdleHead {
            0%, 100% { transform: rotate(-1.5deg) translateY(0px); }
            50% { transform: rotate(2deg) translateY(3px); }
        }
        @keyframes dogIdleBody {
            0%, 100% { transform: scale(1, 1); }
            50% { transform: scale(1.02, 0.985) translateY(1px); }
        }
        @keyframes dogEarLeftIdle {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(4deg); }
        }
        @keyframes dogEarRightIdle {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(-4deg); }
        }
        @keyframes dogTailIdle {
            0%, 100% { transform: rotate(-6deg); }
            50% { transform: rotate(14deg); }
        }
        @keyframes dogBlink {
            0%, 94%, 100% { transform: scaleY(1); }
            97% { transform: scaleY(0.08); }
        }

        .state-idle #dog-head-group { animation: dogIdleHead 3s ease-in-out infinite; }
        .state-idle #dog-body-group { animation: dogIdleBody 3s ease-in-out infinite; }
        .state-idle #ear-left { animation: dogEarLeftIdle 3s ease-in-out infinite; }
        .state-idle #ear-right { animation: dogEarRightIdle 3s ease-in-out infinite; }
        .state-idle #dog-tail { animation: dogTailIdle 1.8s ease-in-out infinite; }
        .eye-blink-group {
            transform-origin: 205px 150px;
            animation: dogBlink 4s infinite;
        }

        /* 2. TRẠNG THÁI ĂN (EATING) */
        @keyframes dogEatHead {
            0%, 100% { transform: translateY(4px) rotate(0deg); }
            35%, 75% { transform: translateY(18px) rotate(5deg); }
            55% { transform: translateY(10px) rotate(2deg); }
        }
        @keyframes dogEatEars {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(8deg); }
        }
        @keyframes dogEatEarsRight {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(-8deg); }
        }
        @keyframes dogChewMouth {
            0%, 100% { transform: scale(0.9, 0.65); }
            50% { transform: scale(1.12, 1.25); }
        }
        @keyframes dogTailFast {
            0%, 100% { transform: rotate(-14deg); }
            50% { transform: rotate(24deg); }
        }
        @keyframes dogPawsEat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(5px); }
        }
        @keyframes crumbFlyLeft {
            0% { opacity: 1; transform: translate(0, 0) scale(1); }
            100% { opacity: 0; transform: translate(-18px, -22px) scale(0.3); }
        }
        @keyframes crumbFlyRight {
            0% { opacity: 1; transform: translate(0, 0) scale(1); }
            100% { opacity: 0; transform: translate(18px, -20px) scale(0.3); }
        }

        .state-eating #dog-head-group { animation: dogEatHead 0.75s ease-in-out infinite; }
        .state-eating #ear-left { animation: dogEatEars 0.38s ease-in-out infinite; }
        .state-eating #ear-right { animation: dogEatEarsRight 0.38s ease-in-out infinite; }
        .state-eating #dog-tail { animation: dogTailFast 0.35s ease-in-out infinite; }
        .state-eating #paws-front { animation: dogPawsEat 0.38s ease-in-out infinite; }
        .state-eating #mouth-eating {
            transform-origin: 205px 175px;
            animation: dogChewMouth 0.25s ease-in-out infinite;
        }
        .state-eating .crumb-l { animation: crumbFlyLeft 0.55s ease-out infinite; }
        .state-eating .crumb-r { animation: crumbFlyRight 0.55s ease-out 0.25s infinite; }

        /* 3. TRẠNG THÁI UỐNG (DRINKING) */
        @keyframes dogDrinkHead {
            0%, 100% { transform: translateY(12px) rotate(4deg); }
            50% { transform: translateY(16px) rotate(7deg); }
        }
        @keyframes dogTongueLap {
            0%, 100% { transform: translateY(0px) scaleY(0.7); }
            50% { transform: translateY(8px) scaleY(1.35); }
        }
        @keyframes waterRippleAnim {
            0%, 100% { transform: scaleX(1); opacity: 0.75; }
            50% { transform: scaleX(0.86); opacity: 1; }
        }
        @keyframes splashDrop {
            0% { opacity: 0; transform: translateY(0) scale(0.5); }
            40% { opacity: 1; }
            100% { opacity: 0; transform: translateY(-16px) scale(1.1); }
        }

        .state-drinking #dog-head-group { animation: dogDrinkHead 0.55s ease-in-out infinite; }
        .state-drinking #dog-tail { animation: dogTailIdle 0.9s ease-in-out infinite; }
        .state-drinking #drink-tongue {
            transform-origin: 205px 174px;
            animation: dogTongueLap 0.28s ease-in-out infinite;
        }
        .state-drinking #water-ripple {
            transform-origin: 215px 282px;
            animation: waterRippleAnim 0.35s ease-in-out infinite;
        }
        .state-drinking .drop-1 { animation: splashDrop 0.65s ease-out infinite; }
        .state-drinking .drop-2 { animation: splashDrop 0.65s ease-out 0.3s infinite; }

        /* 4. TRẠNG THÁI NGỦ (SLEEPING) */
        @keyframes dogSleepBody {
            0%, 100% { transform: scale(1.02, 0.96) translateY(4px); }
            50% { transform: scale(1.06, 0.92) translateY(8px); }
        }
        @keyframes dogSleepHead {
            0%, 100% { transform: translateY(12px) rotate(-8deg); }
            50% { transform: translateY(16px) rotate(-11deg); }
        }
        @keyframes snotBubblePulse {
            0%, 100% { transform: scale(0.55); opacity: 0.75; }
            50% { transform: scale(1.25); opacity: 0.95; }
        }
        @keyframes zzzRise {
            0% { opacity: 0; transform: translate(0, 8px) scale(0.5); }
            40% { opacity: 1; }
            100% { opacity: 0; transform: translate(26px, -42px) scale(1.2); }
        }

        .state-sleeping #dog-body-group { animation: dogSleepBody 3.6s ease-in-out infinite; }
        .state-sleeping #dog-head-group { animation: dogSleepHead 3.6s ease-in-out infinite; }
        .state-sleeping #ear-left { transform: rotate(6deg); }
        .state-sleeping #ear-right { transform: rotate(-6deg); }
        .state-sleeping #dog-tail { transform: rotate(-18deg); transition: transform 0.5s ease; }
        .state-sleeping #sleep-bubble {
            transform-origin: 222px 160px;
            animation: snotBubblePulse 3.6s ease-in-out infinite;
        }
        .state-sleeping .zzz-1 { animation: zzzRise 3s ease-out infinite; }
        .state-sleeping .zzz-2 { animation: zzzRise 3s ease-out 1s infinite; }
        .state-sleeping .zzz-3 { animation: zzzRise 3s ease-out 2s infinite; }

        /* 5. TRẠNG THÁI CƯỜI / HẠNH PHÚC (LAUGHING) */
        @keyframes dogHappyBounce {
            0%, 100% { transform: translateY(0px) scale(1, 1); }
            35% { transform: translateY(-15px) scale(0.96, 1.05); }
            70% { transform: translateY(0px) scale(1.05, 0.95); }
        }
        @keyframes dogHappyHead {
            0%, 100% { transform: rotate(-6deg); }
            50% { transform: rotate(6deg); }
        }
        @keyframes dogHappyEarL {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(15deg); }
        }
        @keyframes dogHappyEarR {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(-15deg); }
        }
        @keyframes dogPawsClap {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-7px) scale(1.06); }
        }
        @keyframes heartFloatUp {
            0% { opacity: 0; transform: translateY(8px) scale(0.4); }
            40% { opacity: 1; transform: translateY(-8px) scale(1.1); }
            100% { opacity: 0; transform: translateY(-34px) scale(0.85); }
        }

        .state-laughing #dog-whole { animation: dogHappyBounce 0.6s ease-in-out infinite; }
        .state-laughing #dog-head-group { animation: dogHappyHead 0.42s ease-in-out infinite; }
        .state-laughing #ear-left { animation: dogHappyEarL 0.3s ease-in-out infinite; }
        .state-laughing #ear-right { animation: dogHappyEarR 0.3s ease-in-out infinite; }
        .state-laughing #paws-front { animation: dogPawsClap 0.3s ease-in-out infinite; }
        .state-laughing #dog-tail { animation: dogTailFast 0.25s ease-in-out infinite; }
        .state-laughing .heart-1 { animation: heartFloatUp 1.2s ease-out infinite; }
        .state-laughing .heart-2 { animation: heartFloatUp 1.2s ease-out 0.4s infinite; }
        .state-laughing .heart-3 { animation: heartFloatUp 1.2s ease-out 0.8s infinite; }

        /* 6. TRẠNG THÁI BUỒN / ĐÓI (SAD) */
        @keyframes dogSadTremble {
            0%, 100% { transform: translateX(0px) scale(0.99, 0.97); }
            25% { transform: translateX(-1.5px) scale(0.99, 0.97); }
            75% { transform: translateX(1.5px) scale(0.99, 0.97); }
        }
        @keyframes dogSadHead {
            0%, 100% { transform: translateY(10px) rotate(-4deg); }
            50% { transform: translateY(13px) rotate(-6deg); }
        }
        @keyframes tearFall {
            0% { opacity: 0; transform: translateY(0px) scale(0.6); }
            30% { opacity: 1; transform: translateY(6px) scale(1); }
            100% { opacity: 0; transform: translateY(24px) scale(0.8); }
        }
        @keyframes gloomCloudBob {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(5px); }
        }

        .state-sad #dog-body-group { animation: dogSadTremble 0.4s ease-in-out infinite; }
        .state-sad #dog-head-group { animation: dogSadHead 2.4s ease-in-out infinite; }
        .state-sad #ear-left { transform: rotate(8deg) translateY(5px); }
        .state-sad #ear-right { transform: rotate(-10deg) translateY(5px); }
        .state-sad #dog-tail { transform: rotate(-28deg); transition: transform 0.4s ease; }
        .state-sad .tear-drop-l { animation: tearFall 1.1s ease-in infinite; }
        .state-sad .tear-drop-r { animation: tearFall 1.1s ease-in 0.55s infinite; }
        .state-sad #gloom-cloud { animation: gloomCloudBob 2s ease-in-out infinite; }

        /* ẨN/HIỆN BIỂU CẢM & ĐẠO CỤ THEO STATE */
        .face-expr, .prop-group, .fx-overlay { display: none; }
        .state-idle .face-idle { display: block; }
        .state-eating .face-eating, .state-eating .prop-food { display: block; }
        .state-drinking .face-drinking, .state-drinking .prop-drink { display: block; }
        .state-sleeping .face-sleeping, .state-sleeping .fx-sleeping { display: block; }
        .state-laughing .face-laughing, .state-laughing .fx-laughing { display: block; }
        .state-sad .face-sad, .state-sad .fx-sad { display: block; }

        /* UI STYLING */
        .kawaii-card {
            border: 3px solid #4A2511;
            box-shadow: 0 6px 0 rgba(74, 37, 17, 0.14);
        }
        .kawaii-btn {
            border: 2.5px solid #4A2511;
            box-shadow: 0 3px 0 #4A2511;
            transition: all 0.12s ease;
        }
        .kawaii-btn:hover:not(:disabled) {
            transform: translateY(-1.5px);
            box-shadow: 0 4.5px 0 #4A2511;
        }
        .kawaii-btn:active:not(:disabled), .kawaii-btn.active-state {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #4A2511;
        }

        ::-webkit-scrollbar { width: 7px; height: 7px; }
        ::-webkit-scrollbar-track { background: #27272a; border-radius: 6px; }
        ::-webkit-scrollbar-thumb { background: #f472b6; border-radius: 6px; }

            user-select: text;

        body {
            background-color: #fdf2f8;
            color: #4B2412;
        }

        /* =========================================================
           1. HỆ THỐNG RIGGING CHUYỂN ĐỘNG THÚ CƯNG & PHỤ KIỆN
           (Phụ kiện gắn trong #pet-head-rig & #pet-body-rig sẽ tự động
            nghiêng và nhún nhảy đồng bộ 100% với thú cưng)
           ========================================================= */
        #pet-root-stage {
            transform-origin: 300px 330px;
        }
        #pet-body-rig {
            transform-origin: 300px 330px;
        }
        #pet-head-rig {
            transform-origin: 300px 235px;
        }

        /* Chế độ 1: Đứng yên thở nhẹ (Idle) */
        @keyframes petIdleBreath {
            0%, 100% { transform: scale(1, 1) translateY(0px); }
            50% { transform: scale(1.018, 0.985) translateY(2px); }
        }
        @keyframes petIdleHeadTilt {
            0%, 100% { transform: rotate(-1.6deg) translateY(0px); }
            50% { transform: rotate(1.8deg) translateY(2.5px); }
        }

        /* Chế độ 2: Nhún nhảy vui vẻ (Happy Bounce) */
        @keyframes petHappyBounce {
            0%, 100% { transform: translateY(0px) scale(1, 1); }
            40% { transform: translateY(-14px) scale(0.96, 1.04); }
            75% { transform: translateY(2px) scale(1.04, 0.96); }
        }
        @keyframes petHappyHeadWag {
            0%, 100% { transform: rotate(-4deg) translateY(0px); }
            50% { transform: rotate(4deg) translateY(-4px); }
        }

        .anim-idle #pet-body-rig {
            animation: petIdleBreath 3.2s ease-in-out infinite;
        }
        .anim-idle #pet-head-rig {
            animation: petIdleHeadTilt 3.2s ease-in-out infinite;
        }

        .anim-bounce #pet-body-rig {
            animation: petHappyBounce 0.65s ease-in-out infinite;
        }
        .anim-bounce #pet-head-rig {
            animation: petHappyHeadWag 0.65s ease-in-out infinite;
        }

        /* =========================================================
           2. ANIMATION RIÊNG CHO TỪNG PHỤ KIỆN THÚ CƯNG (#acc-1 -> #acc-10)
           ========================================================= */
        /* Cánh thiên thần vẫy (#acc-wings) */
        @keyframes wingFlapLeft {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(-12deg) translateY(-3px); }
        }
        @keyframes wingFlapRight {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(12deg) translateY(-3px); }
        }
        #wing-left { transform-origin: 255px 255px; animation: wingFlapLeft 1.4s ease-in-out infinite; }
        #wing-right { transform-origin: 345px 255px; animation: wingFlapRight 1.4s ease-in-out infinite; }

        /* Bóng bay trái tim của Balo (#acc-backpack) */
        @keyframes balloonBob {
            0%, 100% { transform: translateY(0px) rotate(-3deg); }
            50% { transform: translateY(-9px) rotate(4deg); }
        }
        #acc-balloon-float {
            transform-origin: 375px 150px;
            animation: balloonBob 2.6s ease-in-out infinite;
        }

        /* Mầm cây đung đưa (#acc-sprout) */
        @keyframes sproutSway {
            0%, 100% { transform: rotate(-4deg); }
            50% { transform: rotate(6deg); }
        }
        #sprout-stem {
            transform-origin: 300px 134px;
            animation: sproutSway 2.2s ease-in-out infinite;
        }

        /* Chuông vàng lắc nhẹ (#acc-bowtie) */
        @keyframes bellRing {
            0%, 100% { transform: rotate(-5deg); }
            50% { transform: rotate(5deg); }
        }
        #golden-bell {
            transform-origin: 300px 254px;
            animation: bellRing 1.8s ease-in-out infinite;
        }

        /* =========================================================
           3. ANIMATION CHO 10 NỘI THẤT CĂN PHÒNG (#furn-1 -> #furn-10)
           ========================================================= */
        /* 1. Mây trôi ngoài cửa sổ (#furn-window) */
        @keyframes cloudDrift {
            0%, 100% { transform: translateX(-6px); }
            50% { transform: translateX(8px); }
        }
        .window-cloud { animation: cloudDrift 5s ease-in-out infinite; }

        /* 2. Quả lắc đồng hồ mèo (#furn-clock) */
        @keyframes pendulumSwing {
            0%, 100% { transform: rotate(-14deg); }
            50% { transform: rotate(14deg); }
        }
        #clock-pendulum {
            transform-origin: 430px 128px;
            animation: pendulumSwing 1.6s ease-in-out infinite;
        }

        /* 3. Dây đèn LED nhấp nháy (#furn-lights) */
        @keyframes bulbTwinkle {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.55; transform: scale(0.88); }
        }
        .led-bulb-odd { transform-box: fill-box; transform-origin: center; animation: bulbTwinkle 1.8s ease-in-out infinite; }
        .led-bulb-even { transform-box: fill-box; transform-origin: center; animation: bulbTwinkle 1.8s ease-in-out 0.9s infinite; }

        /* 5. Bóng bông trên trụ mèo (#furn-cat-tree) */
        @keyframes pomPomSwing {
            0%, 100% { transform: rotate(-10deg); }
            50% { transform: rotate(10deg); }
        }
        #cat-tree-toy {
            transform-origin: 118px 180px;
            animation: pomPomSwing 2s ease-in-out infinite;
        }

        /* 8. Khói ấm trà bay lên (#furn-tea-table) */
        @keyframes steamRise {
            0% { opacity: 0; transform: translateY(4px) scale(0.8); }
            50% { opacity: 0.75; }
            100% { opacity: 0; transform: translateY(-16px) scale(1.2); }
        }
        .tea-steam-1 { animation: steamRise 2.4s ease-out infinite; }
        .tea-steam-2 { animation: steamRise 2.4s ease-out 1.2s infinite; }

        /* 9. Nốt nhạc bay lên từ máy đĩa than (#furn-gramophone) */
        @keyframes noteFloat {
            0% { opacity: 0; transform: translate(0, 6px) scale(0.6); }
            45% { opacity: 1; }
            100% { opacity: 0; transform: translate(-14px, -26px) scale(1.15); }
        }
        .music-note-1 { animation: noteFloat 2.6s ease-out infinite; }
        .music-note-2 { animation: noteFloat 2.6s ease-out 1.3s infinite; }

        /* 10. Ánh sáng đèn Hoa Linh Lan (#furn-lamp) */
        @keyframes lampGlowPulse {
            0%, 100% { opacity: 0.45; transform: scale(1); }
            50% { opacity: 0.75; transform: scale(1.08); }
        }
        .lamp-glow {
            transform-box: fill-box;
            transform-origin: center;
            animation: lampGlowPulse 2.8s ease-in-out infinite;
        }

        /* Ẩn các vật phẩm mặc định khi chưa bật class .item-visible */
        .room-item, .pet-acc, .pet-model {
            display: none;
        }
        .room-item.item-visible, .pet-acc.item-visible, .pet-model.pet-active {
            display: block;
        }

        /* UI Kawaii Card & Button */
        .kawaii-card {
            border: 3px solid #4B2412;
            box-shadow: 0 6px 0 rgba(75, 36, 18, 0.14);
        }
        .kawaii-btn {
            border: 2.5px solid #4B2412;
            box-shadow: 0 3px 0 #4B2412;
            transition: all 0.12s ease;
        }
        .kawaii-btn:hover:not(:disabled) {
            transform: translateY(-1.5px);
            box-shadow: 0 4.5px 0 #4B2412;
        }
        .kawaii-btn:active:not(:disabled), .kawaii-btn.active-btn {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #4B2412;
        }

        ::-webkit-scrollbar { width: 7px; height: 7px; }
        ::-webkit-scrollbar-track { background: #181825; border-radius: 6px; }
        ::-webkit-scrollbar-thumb { background: #f472b6; border-radius: 6px; }
