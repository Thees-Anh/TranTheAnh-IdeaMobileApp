<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'">
<style>
        * {
            font-family: 'Quicksand', sans-serif;
            user-select: none;
        }
        code, pre, .font-mono {
            font-family: 'JetBrains Mono', monospace;
            user-select: text;
        }

        body {
            background-color: #fdf2f8;
            color: #4A2311;
        }

        /* =========================================================
           HỆ THỐNG RIGGING & KEYFRAME ANIMATIONS CHO CAPYBARA MẪU
           ========================================================= */
        #capy-whole {
            transform-origin: 205px 282px;
            transition: transform 0.3s ease;
        }
        #capy-body-group {
            transform-origin: 205px 282px;
        }
        #capy-head-group {
            transform-origin: 198px 188px;
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        #ear-left {
            transform-origin: 150px 104px;
            transition: transform 0.3s ease;
        }
        #ear-right {
            transform-origin: 235px 96px;
            transition: transform 0.3s ease;
        }
        #head-orange {
            transform-origin: 198px 94px;
            transition: transform 0.3s ease;
        }
        #snout-group {
            transform-origin: 246px 150px;
        }

        /* =========================================================
           1. TRẠNG THÁI ĐỨNG YÊN (IDLE - .state-idle)
           ========================================================= */
        @keyframes capyIdleBreath {
            0%, 100% { transform: scale(1, 1) translateY(0px); }
            50% { transform: scale(1.018, 0.985) translateY(2px); }
        }
        @keyframes capyIdleHead {
            0%, 100% { transform: rotate(0deg) translateY(0px); }
            50% { transform: rotate(1.6deg) translateY(2.5px); }
        }
        @keyframes orangeBalance {
            0%, 100% { transform: rotate(-2.5deg) translateY(0px); }
            50% { transform: rotate(3deg) translateY(1px); }
        }
        @keyframes capyEarTwitch {
            0%, 84%, 100% { transform: rotate(0deg); }
            88% { transform: rotate(-10deg); }
            93% { transform: rotate(5deg); }
        }
        @keyframes capyChillBlink {
            0%, 92%, 100% { transform: scaleY(1); }
            96% { transform: scaleY(0.15); }
        }

        .state-idle #capy-body-group { animation: capyIdleBreath 3.4s ease-in-out infinite; }
        .state-idle #capy-head-group { animation: capyIdleHead 3.4s ease-in-out infinite; }
        .state-idle #head-orange { animation: orangeBalance 3.4s ease-in-out infinite; }
        .state-idle #ear-left { animation: capyEarTwitch 4.2s ease-in-out infinite; }
        .state-idle .idle-eye-blink {
            transform-origin: 184px 132px;
            animation: capyChillBlink 4.5s infinite;
        }

        /* =========================================================
           2. TRẠNG THÁI ĂN (EATING - .state-eating)
           ========================================================= */
        @keyframes capyEatDip {
            0%, 100% { transform: rotate(2deg) translateY(3px); }
            50% { transform: rotate(6.5deg) translateY(9px); }
        }
        @keyframes capySnoutMunch {
            0%, 100% { transform: scale(1, 1) translateY(0px); }
            50% { transform: scale(1.05, 0.94) translateY(2.5px); }
        }
        @keyframes capyMouthChew {
            0%, 100% { transform: scale(0.92, 0.65); }
            50% { transform: scale(1.12, 1.22); }
        }
        @keyframes orangeEatBounce {
            0%, 100% { transform: translateY(0px) rotate(-3deg); }
            50% { transform: translateY(-5px) rotate(4deg); }
        }
        @keyframes foodCrumbR {
            0% { opacity: 1; transform: translate(0, 0) scale(1); }
            100% { opacity: 0; transform: translate(18px, -14px) scale(0.3); }
        }
        @keyframes foodCrumbL {
            0% { opacity: 1; transform: translate(0, 0) scale(1); }
            100% { opacity: 0; transform: translate(-14px, -16px) scale(0.3); }
        }

        .state-eating #capy-head-group { animation: capyEatDip 0.65s ease-in-out infinite; }
        .state-eating #snout-group { animation: capySnoutMunch 0.32s ease-in-out infinite; }
        .state-eating #capy-chew-mouth {
            transform-origin: 249px 170px;
            animation: capyMouthChew 0.32s ease-in-out infinite;
        }
        .state-eating #head-orange { animation: orangeEatBounce 0.32s ease-in-out infinite; }
        .state-eating .crumb-1 { animation: foodCrumbR 0.55s ease-out infinite; }
        .state-eating .crumb-2 { animation: foodCrumbL 0.55s ease-out 0.25s infinite; }

        /* =========================================================
           3. TRẠNG THÁI UỐNG (DRINKING - .state-drinking)
           ========================================================= */
        @keyframes capyDrinkHead {
            0%, 100% { transform: rotate(4deg) translateY(6px); }
            50% { transform: rotate(6.5deg) translateY(9px); }
        }
        @keyframes capySipMouth {
            0%, 100% { transform: scale(1, 1); }
            50% { transform: scale(0.82, 1.18); }
        }
        @keyframes drinkRipple {
            0%, 100% { transform: scaleX(1); opacity: 0.75; }
            50% { transform: scaleX(0.82); opacity: 1; }
        }
        @keyframes bubbleUp {
            0% { opacity: 0; transform: translateY(4px) scale(0.5); }
            50% { opacity: 1; }
            100% { opacity: 0; transform: translateY(-16px) scale(1.15); }
        }

        .state-drinking #capy-head-group { animation: capyDrinkHead 0.55s ease-in-out infinite; }
        .state-drinking #capy-sip-mouth {
            transform-origin: 249px 171px;
            animation: capySipMouth 0.28s ease-in-out infinite;
        }
        .state-drinking #head-orange { animation: orangeBalance 1.1s ease-in-out infinite; }
        .state-drinking #water-ripple {
            transform-origin: 282px 268px;
            animation: drinkRipple 0.38s ease-in-out infinite;
        }
        .state-drinking .drink-bubble-1 { animation: bubbleUp 0.9s ease-out infinite; }
        .state-drinking .drink-bubble-2 { animation: bubbleUp 0.9s ease-out 0.45s infinite; }

        /* =========================================================
           4. TRẠNG THÁI NGỦ (SLEEPING - .state-sleeping)
           ========================================================= */
        @keyframes capySleepBody {
            0%, 100% { transform: scale(1.01, 0.98) translateY(2px); }
            50% { transform: scale(1.045, 0.945) translateY(6px); }
        }
        @keyframes capySleepHead {
            0%, 100% { transform: rotate(2deg) translateY(4px); }
            50% { transform: rotate(5deg) translateY(9px); }
        }
        @keyframes snotBubblePulse {
            0%, 100% { transform: scale(0.55); opacity: 0.75; }
            50% { transform: scale(1.28); opacity: 0.96; }
        }
        @keyframes zzzDrift {
            0% { opacity: 0; transform: translate(0, 10px) scale(0.55); }
            40% { opacity: 1; }
            100% { opacity: 0; transform: translate(22px, -38px) scale(1.18); }
        }

        .state-sleeping #capy-body-group { animation: capySleepBody 3.8s ease-in-out infinite; }
        .state-sleeping #capy-head-group { animation: capySleepHead 3.8s ease-in-out infinite; }
        .state-sleeping #sleep-bubble {
            transform-origin: 266px 142px;
            animation: snotBubblePulse 3.8s ease-in-out infinite;
        }
        .state-sleeping .zzz-1 { animation: zzzDrift 3s ease-out infinite; }
        .state-sleeping .zzz-2 { animation: zzzDrift 3s ease-out 1s infinite; }
        .state-sleeping .zzz-3 { animation: zzzDrift 3s ease-out 2s infinite; }

        /* =========================================================
           5. TRẠNG THÁI CƯỜI (LAUGHING - .state-laughing)
           ========================================================= */
        @keyframes capyHappyBounce {
            0%, 100% { transform: translateY(0px) scale(1, 1); }
            38% { transform: translateY(-13px) scale(0.96, 1.04); }
            72% { transform: translateY(0px) scale(1.04, 0.96); }
        }
        @keyframes capyHappyHead {
            0%, 100% { transform: rotate(-3deg); }
            50% { transform: rotate(4deg); }
        }
        @keyframes orangeJoyJump {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            40% { transform: translateY(-12px) rotate(-10deg); }
            75% { transform: translateY(0px) rotate(6deg); }
        }
        @keyframes heartBurst {
            0% { opacity: 0; transform: translateY(8px) scale(0.4); }
            45% { opacity: 1; transform: translateY(-10px) scale(1.12); }
            100% { opacity: 0; transform: translateY(-34px) scale(0.85); }
        }

        .state-laughing #capy-whole { animation: capyHappyBounce 0.56s ease-in-out infinite; }
        .state-laughing #capy-head-group { animation: capyHappyHead 0.38s ease-in-out infinite; }
        .state-laughing #head-orange { animation: orangeJoyJump 0.56s ease-in-out infinite; }
        .state-laughing .heart-1 { animation: heartBurst 1.15s ease-out infinite; }
        .state-laughing .heart-2 { animation: heartBurst 1.15s ease-out 0.38s infinite; }
        .state-laughing .heart-3 { animation: heartBurst 1.15s ease-out 0.76s infinite; }

        /* =========================================================
           6. TRẠNG THÁI BUỒN (SAD - .state-sad)
           ========================================================= */
        @keyframes capySadShiver {
            0%, 100% { transform: translateX(0px) translateY(3px); }
            25% { transform: translateX(-1.5px) translateY(4px); }
            75% { transform: translateX(1.5px) translateY(4px); }
        }
        @keyframes capySadDroop {
            0%, 100% { transform: rotate(5deg) translateY(6px); }
            50% { transform: rotate(7deg) translateY(9px); }
        }
        @keyframes orangeSlipTilt {
            0%, 100% { transform: translate(8px, 3px) rotate(18deg); }
            50% { transform: translate(11px, 5px) rotate(24deg); }
        }
        @keyframes tearStream {
            0% { opacity: 0; transform: translateY(0px) scale(0.6); }
            35% { opacity: 1; }
            100% { opacity: 0; transform: translateY(24px) scale(1); }
        }
        @keyframes rainFall {
            0% { opacity: 0; transform: translateY(0px); }
            40% { opacity: 0.85; }
            100% { opacity: 0; transform: translateY(22px); }
        }

        .state-sad #capy-body-group { animation: capySadShiver 0.45s ease-in-out infinite; }
        .state-sad #capy-head-group { animation: capySadDroop 2.6s ease-in-out infinite; }
        .state-sad #ear-left { transform: rotate(-18deg) translateY(4px); }
        .state-sad #ear-right { transform: rotate(14deg) translateY(4px); }
        .state-sad #head-orange { animation: orangeSlipTilt 2.6s ease-in-out infinite; }
        .state-sad .tear-drop-1 { animation: tearStream 1.1s ease-in infinite; }
        .state-sad .tear-drop-2 { animation: tearStream 1.1s ease-in 0.55s infinite; }
        .state-sad .rain-1 { animation: rainFall 0.85s linear infinite; }
        .state-sad .rain-2 { animation: rainFall 0.85s linear 0.3s infinite; }
        .state-sad .rain-3 { animation: rainFall 0.85s linear 0.6s infinite; }

        /* ẨN/HIỆN BIỂU CẢM & ĐẠO CỤ THEO STATE */
        .face-expr, .prop-group, .fx-overlay { display: none; }
        .state-idle .face-normal { display: block; }
        .state-eating .face-eating, .state-eating .prop-food { display: block; }
        .state-drinking .face-drinking, .state-drinking .prop-drink { display: block; }
        .state-sleeping .face-sleeping, .state-sleeping .fx-sleeping { display: block; }
        .state-laughing .face-laughing, .state-laughing .fx-laughing { display: block; }
        .state-sad .face-sad, .state-sad .fx-sad { display: block; }

        /* UI STYLING */
        .kawaii-card {
            border: 3px solid #4A2311;
            box-shadow: 0 6px 0 rgba(74, 35, 17, 0.15);
        }
        .kawaii-btn {
            border: 2.5px solid #4A2311;
            box-shadow: 0 3px 0 #4A2311;
            transition: all 0.12s ease;
        }
        .kawaii-btn:hover:not(:disabled) {
            transform: translateY(-1.5px);
            box-shadow: 0 4.5px 0 #4A2311;
        }
        .kawaii-btn:active:not(:disabled), .kawaii-btn.active-state {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #4A2311;
        }

        ::-webkit-scrollbar { width: 7px; height: 7px; }
        ::-webkit-scrollbar-track { background: #27272a; border-radius: 6px; }
        ::-webkit-scrollbar-thumb { background: #fb923c; border-radius: 6px; }
    
html,body{margin:0;width:100%;height:auto;overflow:hidden;background:#FFD9EC}

* {

            user-select: none;

        code, pre, .font-mono {
            font-family: 'JetBrains Mono', monospace;
            user-select: text;
        }
        body {
            background-color: #fdf2f8;
            color: #4B2412;
        }

        /* =========================================================
           1. HỆ THỐNG RIGGING CHUYỂN ĐỘNG THÚ CƯNG & PHỤ KIỆN
           (Phụ kiện gắn trong #pet-head-rig & #pet-body-rig sẽ tự động
            nghiêng và nhún nhảy đồng bộ 100% với thú cưng)
           ========================================================= */
        #pet-root-stage {
            transform-origin: 300px 330px;
        }
        #pet-body-rig {
            transform-origin: 300px 330px;
        }
        #pet-head-rig {
            transform-origin: 300px 235px;
        }

        /* Chế độ 1: Đứng yên thở nhẹ (Idle) */
        @keyframes petIdleBreath {
            0%, 100% { transform: scale(1, 1) translateY(0px); }
            50% { transform: scale(1.018, 0.985) translateY(2px); }
        }
        @keyframes petIdleHeadTilt {
            0%, 100% { transform: rotate(-1.6deg) translateY(0px); }
            50% { transform: rotate(1.8deg) translateY(2.5px); }
        }

        /* Chế độ 2: Nhún nhảy vui vẻ (Happy Bounce) */
        @keyframes petHappyBounce {
            0%, 100% { transform: translateY(0px) scale(1, 1); }
            40% { transform: translateY(-14px) scale(0.96, 1.04); }
            75% { transform: translateY(2px) scale(1.04, 0.96); }
        }
        @keyframes petHappyHeadWag {
            0%, 100% { transform: rotate(-4deg) translateY(0px); }
            50% { transform: rotate(4deg) translateY(-4px); }
        }

        .anim-idle #pet-body-rig {
            animation: petIdleBreath 3.2s ease-in-out infinite;
        }
        .anim-idle #pet-head-rig {
            animation: petIdleHeadTilt 3.2s ease-in-out infinite;
        }

        .anim-bounce #pet-body-rig {
            animation: petHappyBounce 0.65s ease-in-out infinite;
        }
        .anim-bounce #pet-head-rig {
            animation: petHappyHeadWag 0.65s ease-in-out infinite;
        }

        /* =========================================================
           2. ANIMATION RIÊNG CHO TỪNG PHỤ KIỆN THÚ CƯNG (#acc-1 -> #acc-10)
           ========================================================= */
        /* Cánh thiên thần vẫy (#acc-wings) */
        @keyframes wingFlapLeft {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(-12deg) translateY(-3px); }
        }
        @keyframes wingFlapRight {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(12deg) translateY(-3px); }
        }
        #wing-left { transform-origin: 255px 255px; animation: wingFlapLeft 1.4s ease-in-out infinite; }
        #wing-right { transform-origin: 345px 255px; animation: wingFlapRight 1.4s ease-in-out infinite; }

        /* Bóng bay trái tim của Balo (#acc-backpack) */
        @keyframes balloonBob {
            0%, 100% { transform: translateY(0px) rotate(-3deg); }
            50% { transform: translateY(-9px) rotate(4deg); }
        }
        #acc-balloon-float {
            transform-origin: 375px 150px;
            animation: balloonBob 2.6s ease-in-out infinite;
        }

        /* Mầm cây đung đưa (#acc-sprout) */
        @keyframes sproutSway {
            0%, 100% { transform: rotate(-4deg); }
            50% { transform: rotate(6deg); }
        }
        #sprout-stem {
            transform-origin: 300px 134px;
            animation: sproutSway 2.2s ease-in-out infinite;
        }

        /* Chuông vàng lắc nhẹ (#acc-bowtie) */
        @keyframes bellRing {
            0%, 100% { transform: rotate(-5deg); }
            50% { transform: rotate(5deg); }
        }
        #golden-bell {
            transform-origin: 300px 254px;
            animation: bellRing 1.8s ease-in-out infinite;
        }

        /* =========================================================
           3. ANIMATION CHO 10 NỘI THẤT CĂN PHÒNG (#furn-1 -> #furn-10)
           ========================================================= */
        /* 1. Mây trôi ngoài cửa sổ (#furn-window) */
        @keyframes cloudDrift {
            0%, 100% { transform: translateX(-6px); }
            50% { transform: translateX(8px); }
        }
        .window-cloud { animation: cloudDrift 5s ease-in-out infinite; }

        /* 2. Quả lắc đồng hồ mèo (#furn-clock) */
        @keyframes pendulumSwing {
            0%, 100% { transform: rotate(-14deg); }
            50% { transform: rotate(14deg); }
        }
        #clock-pendulum {
            transform-origin: 430px 128px;
            animation: pendulumSwing 1.6s ease-in-out infinite;
        }

        /* 3. Dây đèn LED nhấp nháy (#furn-lights) */
        @keyframes bulbTwinkle {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.55; transform: scale(0.88); }
        }
        .led-bulb-odd { transform-box: fill-box; transform-origin: center; animation: bulbTwinkle 1.8s ease-in-out infinite; }
        .led-bulb-even { transform-box: fill-box; transform-origin: center; animation: bulbTwinkle 1.8s ease-in-out 0.9s infinite; }

        /* 5. Bóng bông trên trụ mèo (#furn-cat-tree) */
        @keyframes pomPomSwing {
            0%, 100% { transform: rotate(-10deg); }
            50% { transform: rotate(10deg); }
        }
        #cat-tree-toy {
            transform-origin: 118px 180px;
            animation: pomPomSwing 2s ease-in-out infinite;
        }

        /* 8. Khói ấm trà bay lên (#furn-tea-table) */
        @keyframes steamRise {
            0% { opacity: 0; transform: translateY(4px) scale(0.8); }
            50% { opacity: 0.75; }
            100% { opacity: 0; transform: translateY(-16px) scale(1.2); }
        }
        .tea-steam-1 { animation: steamRise 2.4s ease-out infinite; }
        .tea-steam-2 { animation: steamRise 2.4s ease-out 1.2s infinite; }

        /* 9. Nốt nhạc bay lên từ máy đĩa than (#furn-gramophone) */
        @keyframes noteFloat {
            0% { opacity: 0; transform: translate(0, 6px) scale(0.6); }
            45% { opacity: 1; }
            100% { opacity: 0; transform: translate(-14px, -26px) scale(1.15); }
        }
        .music-note-1 { animation: noteFloat 2.6s ease-out infinite; }
        .music-note-2 { animation: noteFloat 2.6s ease-out 1.3s infinite; }

        /* 10. Ánh sáng đèn Hoa Linh Lan (#furn-lamp) */
        @keyframes lampGlowPulse {
            0%, 100% { opacity: 0.45; transform: scale(1); }
            50% { opacity: 0.75; transform: scale(1.08); }
        }
        .lamp-glow {
            transform-box: fill-box;
            transform-origin: center;
            animation: lampGlowPulse 2.8s ease-in-out infinite;
        }

        /* Ẩn các vật phẩm mặc định khi chưa bật class .item-visible */
        .room-item, .pet-acc, .pet-model {
            display: none;
        }
        .room-item.item-visible, .pet-acc.item-visible, .pet-model.pet-active {
            display: block;
        }

        /* UI Kawaii Card & Button */
        .kawaii-card {
            border: 3px solid #4B2412;
            box-shadow: 0 6px 0 rgba(75, 36, 18, 0.14);
        }
        .kawaii-btn {
            border: 2.5px solid #4B2412;
            box-shadow: 0 3px 0 #4B2412;
            transition: all 0.12s ease;
        }
        .kawaii-btn:hover:not(:disabled) {
            transform: translateY(-1.5px);
            box-shadow: 0 4.5px 0 #4B2412;
        }
        .kawaii-btn:active:not(:disabled), .kawaii-btn.active-btn {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #4B2412;
        }

        ::-webkit-scrollbar { width: 7px; height: 7px; }
        ::-webkit-scrollbar-track { background: #181825; border-radius: 6px; }
        ::-webkit-scrollbar-thumb { background: #f472b6; border-radius: 6px; }
