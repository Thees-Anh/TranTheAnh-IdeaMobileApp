<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; connect-src 'none'">
<style>
        * {
            font-family: 'Quicksand', sans-serif;
            user-select: none;
        }
        code, pre, .font-mono {
            font-family: 'JetBrains Mono', monospace;
            user-select: text;
        }

        body {
            background-color: #fdf2f8;
            color: #4A2511;
        }

        /* =========================================================
           HỆ THỐNG RIGGING & KEYFRAME ANIMATIONS CHO CHÚ MÈO MẪU
           ========================================================= */
        #cat-whole {
            transform-origin: 205px 275px;
            transition: transform 0.3s ease;
        }
        #cat-body-group {
            transform-origin: 205px 265px;
        }
        #cat-head-group {
            transform-origin: 205px 185px;
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        #ear-left {
            transform-origin: 150px 108px;
        }
        #ear-right {
            transform-origin: 252px 102px;
        }
        #cat-tail {
            transform-origin: 158px 258px;
        }
        #paw-right-flip {
            transform-origin: 228px 236px;
        }

        /* =========================================================
           1. TRẠNG THÁI ĐỌC SÁCH (READING - .state-reading)
           ========================================================= */
        /* Đầu cúi nhẹ xuống trang sách và liếc ngang trái-phải theo dòng chữ */
        @keyframes catReadHeadPan {
            0%, 100% { transform: translateY(9px) rotate(-3.5deg) translateX(-3px); }
            45% { transform: translateY(11px) rotate(2.5deg) translateX(4px); }
            75% { transform: translateY(10px) rotate(3deg) translateX(4px); }
            90% { transform: translateY(7px) rotate(-4deg) translateX(-3px); }
        }
        /* Con ngươi mắt di chuyển đọc từng dòng chữ */
        @keyframes catEyeScanBook {
            0%, 100% { transform: translate(-3.5px, 3px); }
            45%, 75% { transform: translate(4px, 3px); }
            88% { transform: translate(-4px, 1px); }
        }
        /* Chân trước bên phải khều lật trang sách mỗi chu kỳ 2.6s */
        @keyframes catPawFlipAction {
            0%, 70%, 100% { transform: translate(0, 0) rotate(0deg); }
            78% { transform: translate(5px, -10px) rotate(-14deg); }
            86% { transform: translate(-8px, -6px) rotate(10deg); }
        }
        /* Trang sách lật từ phải sang trái đồng bộ với nhịp chân mèo */
        @keyframes bookPageTurn {
            0%, 72% {
                transform: scaleX(1) skewY(0deg);
                opacity: 0;
            }
            75% {
                transform: scaleX(0.95) skewY(-6deg);
                opacity: 1;
            }
            84% {
                transform: scaleX(0.05) skewY(-18deg);
                opacity: 1;
            }
            92% {
                transform: scaleX(-0.95) skewY(6deg);
                opacity: 0.9;
            }
            96%, 100% {
                transform: scaleX(-1) skewY(0deg);
                opacity: 0;
            }
        }
        /* Hiệu ứng bóng đèn ý tưởng & lấp lánh kiến thức bay lên */
        @keyframes ideaFloat {
            0%, 100% { transform: translateY(0px) scale(1); opacity: 0.95; }
            50% { transform: translateY(-7px) scale(1.08); opacity: 1; }
        }
        @keyframes sparkleTwinkle {
            0%, 100% { opacity: 0.3; transform: scale(0.75) rotate(0deg); }
            50% { opacity: 1; transform: scale(1.15) rotate(20deg); }
        }

        .state-reading #cat-head-group { animation: catReadHeadPan 2.6s ease-in-out infinite; }
        .state-reading #cat-body-group { animation: catIdleBody 3.2s ease-in-out infinite; }
        .state-reading #cat-tail { animation: catTailSlow 2.8s ease-in-out infinite; }
        .state-reading #ear-left { animation: catEarTwitchL 2.6s ease-in-out infinite; }
        .state-reading .reading-pupils { animation: catEyeScanBook 2.6s ease-in-out infinite; }
        .state-reading #paw-right-flip { animation: catPawFlipAction 2.6s ease-in-out infinite; }
        .state-reading #book-flip-page {
            transform-origin: 205px 286px;
            animation: bookPageTurn 2.6s ease-in-out infinite;
        }
        .state-reading #idea-bulb { animation: ideaFloat 2.2s ease-in-out infinite; }
        .state-reading .read-sparkle-1 {
            transform-origin: 118px 98px;
            animation: sparkleTwinkle 1.8s ease-in-out infinite;
        }
        .state-reading .read-sparkle-2 {
            transform-origin: 292px 92px;
            animation: sparkleTwinkle 1.8s ease-in-out 0.9s infinite;
        }

        /* =========================================================
           2. TRẠNG THÁI ĐỨNG YÊN (IDLE - .state-idle)
           ========================================================= */
        @keyframes catIdleHead {
            0%, 100% { transform: rotate(-1.8deg) translateY(0px); }
            50% { transform: rotate(2.2deg) translateY(2.5px); }
        }
        @keyframes catIdleBody {
            0%, 100% { transform: scale(1, 1); }
            50% { transform: scale(1.02, 0.985) translateY(1px); }
        }
        @keyframes catTailSlow {
            0%, 100% { transform: rotate(-5deg); }
            50% { transform: rotate(9deg); }
        }
        @keyframes catEarTwitchL {
            0%, 86%, 100% { transform: rotate(0deg); }
            90% { transform: rotate(-9deg); }
            94% { transform: rotate(4deg); }
        }
        @keyframes catBlink {
            0%, 94%, 100% { transform: scaleY(1); }
            97% { transform: scaleY(0.08); }
        }

        .state-idle #cat-head-group { animation: catIdleHead 3.2s ease-in-out infinite; }
        .state-idle #cat-body-group { animation: catIdleBody 3.2s ease-in-out infinite; }
        .state-idle #cat-tail { animation: catTailSlow 2.2s ease-in-out infinite; }
        .state-idle #ear-left { animation: catEarTwitchL 4.5s ease-in-out infinite; }
        .eye-blink-group {
            transform-origin: 205px 152px;
            animation: catBlink 4s infinite;
        }

        /* =========================================================
           3. TRẠNG THÁI ĂN (EATING - .state-eating)
           ========================================================= */
        @keyframes catEatHead {
            0%, 100% { transform: translateY(4px) rotate(-1deg); }
            40%, 75% { transform: translateY(16px) rotate(4deg); }
            58% { transform: translateY(9px) rotate(1deg); }
        }
        @keyframes catChewMouth {
            0%, 100% { transform: scale(0.9, 0.65); }
            50% { transform: scale(1.15, 1.25); }
        }
        @keyframes catTailFast {
            0%, 100% { transform: rotate(-12deg); }
            50% { transform: rotate(18deg); }
        }
        @keyframes crumbFlyL {
            0% { opacity: 1; transform: translate(0, 0) scale(1); }
            100% { opacity: 0; transform: translate(-16px, -18px) scale(0.3); }
        }
        @keyframes crumbFlyR {
            0% { opacity: 1; transform: translate(0, 0) scale(1); }
            100% { opacity: 0; transform: translate(16px, -16px) scale(0.3); }
        }

        .state-eating #cat-head-group { animation: catEatHead 0.72s ease-in-out infinite; }
        .state-eating #cat-tail { animation: catTailFast 0.4s ease-in-out infinite; }
        .state-eating #mouth-eating {
            transform-origin: 208px 162px;
            animation: catChewMouth 0.24s ease-in-out infinite;
        }
        .state-eating .crumb-l { animation: crumbFlyL 0.55s ease-out infinite; }
        .state-eating .crumb-r { animation: crumbFlyR 0.55s ease-out 0.25s infinite; }

        /* =========================================================
           4. TRẠNG THÁI UỐNG (DRINKING - .state-drinking)
           ========================================================= */
        @keyframes catDrinkHead {
            0%, 100% { transform: translateY(11px) rotate(3deg); }
            50% { transform: translateY(15px) rotate(6deg); }
        }
        @keyframes catTongueLap {
            0%, 100% { transform: translateY(0px) scaleY(0.7); }
            50% { transform: translateY(7px) scaleY(1.35); }
        }
        @keyframes milkRippleAnim {
            0%, 100% { transform: scaleX(1); opacity: 0.8; }
            50% { transform: scaleX(0.84); opacity: 1; }
        }

        .state-drinking #cat-head-group { animation: catDrinkHead 0.55s ease-in-out infinite; }
        .state-drinking #cat-tail { animation: catTailSlow 1.1s ease-in-out infinite; }
        .state-drinking #drink-tongue {
            transform-origin: 208px 162px;
            animation: catTongueLap 0.28s ease-in-out infinite;
        }
        .state-drinking #milk-ripple {
            transform-origin: 212px 276px;
            animation: milkRippleAnim 0.35s ease-in-out infinite;
        }

        /* =========================================================
           5. TRẠNG THÁI NGỦ (SLEEPING - .state-sleeping)
           ========================================================= */
        @keyframes catSleepBody {
            0%, 100% { transform: scale(1.02, 0.96) translateY(3px); }
            50% { transform: scale(1.05, 0.93) translateY(6px); }
        }
        @keyframes catSleepHead {
            0%, 100% { transform: translateY(11px) rotate(-6deg); }
            50% { transform: translateY(15px) rotate(-9deg); }
        }
        @keyframes sleepBubblePulse {
            0%, 100% { transform: scale(0.55); opacity: 0.75; }
            50% { transform: scale(1.25); opacity: 0.95; }
        }
        @keyframes zzzFloat {
            0% { opacity: 0; transform: translate(0, 8px) scale(0.5); }
            40% { opacity: 1; }
            100% { opacity: 0; transform: translate(24px, -40px) scale(1.2); }
        }

        .state-sleeping #cat-body-group { animation: catSleepBody 3.6s ease-in-out infinite; }
        .state-sleeping #cat-head-group { animation: catSleepHead 3.6s ease-in-out infinite; }
        .state-sleeping #sleep-bubble {
            transform-origin: 224px 154px;
            animation: sleepBubblePulse 3.6s ease-in-out infinite;
        }
        .state-sleeping .zzz-1 { animation: zzzFloat 3s ease-out infinite; }
        .state-sleeping .zzz-2 { animation: zzzFloat 3s ease-out 1s infinite; }
        .state-sleeping .zzz-3 { animation: zzzFloat 3s ease-out 2s infinite; }

        /* =========================================================
           6. TRẠNG THÁI CƯỜI (LAUGHING - .state-laughing)
           ========================================================= */
        @keyframes catHappyBounce {
            0%, 100% { transform: translateY(0px) scale(1, 1); }
            35% { transform: translateY(-14px) scale(0.96, 1.05); }
            70% { transform: translateY(0px) scale(1.05, 0.95); }
        }
        @keyframes catHappyHead {
            0%, 100% { transform: rotate(-5deg); }
            50% { transform: rotate(5deg); }
        }
        @keyframes heartFloatUp {
            0% { opacity: 0; transform: translateY(8px) scale(0.4); }
            40% { opacity: 1; transform: translateY(-8px) scale(1.1); }
            100% { opacity: 0; transform: translateY(-34px) scale(0.85); }
        }

        .state-laughing #cat-whole { animation: catHappyBounce 0.58s ease-in-out infinite; }
        .state-laughing #cat-head-group { animation: catHappyHead 0.4s ease-in-out infinite; }
        .state-laughing #cat-tail { animation: catTailFast 0.28s ease-in-out infinite; }
        .state-laughing .heart-1 { animation: heartFloatUp 1.2s ease-out infinite; }
        .state-laughing .heart-2 { animation: heartFloatUp 1.2s ease-out 0.4s infinite; }
        .state-laughing .heart-3 { animation: heartFloatUp 1.2s ease-out 0.8s infinite; }

        /* ẨN/HIỆN BIỂU CẢM & ĐẠO CỤ THEO STATE */
        .face-expr, .prop-group, .fx-overlay { display: none; }
        .state-reading .face-reading, .state-reading .prop-book, .state-reading .fx-reading { display: block; }
        .state-idle .face-normal { display: block; }
        .state-eating .face-eating, .state-eating .prop-food { display: block; }
        .state-drinking .face-drinking, .state-drinking .prop-drink { display: block; }
        .state-sleeping .face-sleeping, .state-sleeping .fx-sleeping { display: block; }
        .state-laughing .face-laughing, .state-laughing .fx-laughing { display: block; }

        /* UI STYLING */
        .kawaii-card {
            border: 3px solid #4A2511;
            box-shadow: 0 6px 0 rgba(74, 37, 17, 0.14);
        }
        .kawaii-btn {
            border: 2.5px solid #4A2511;
            box-shadow: 0 3px 0 #4A2511;
            transition: all 0.12s ease;
        }
        .kawaii-btn:hover:not(:disabled) {
            transform: translateY(-1.5px);
            box-shadow: 0 4.5px 0 #4A2511;
        }
        .kawaii-btn:active:not(:disabled), .kawaii-btn.active-state {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #4A2511;
        }

        ::-webkit-scrollbar { width: 7px; height: 7px; }
        ::-webkit-scrollbar-track { background: #27272a; border-radius: 6px; }
        ::-webkit-scrollbar-thumb { background: #f472b6; border-radius: 6px; }
